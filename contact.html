<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="contact">
    <section class="con">
        <form class="form">
            <div><label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="name" class="inp"></div>
            <div><label>Email:</label>
            <input type="email" id="email" name="email" placeholder="email" class="inp"></div>
            <div><label>Message:</label>
            <textarea name="Message" id="Message" placeholder="Message"></textarea></div>
            <button type="submit">Send Message</button>
        </form>
    </section>
    <footer>
        <p>&copy; 2026 John Dayo. All Rights Reserved.</p>
        <p>Built with HTML & CSS</p>
    </footer>
</body>
</html>
